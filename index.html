<!doctype html>
<html lang="es" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  CASA · app de escritorio con el sistema de diseño «Casa Blobs»
  Un solo archivo. Usa el mismo Supabase que Boxy (tablas objetos, huellas, personas, huella_personas, integraciones).
  · Inicio    = diario de huellas (registro rápido, semana, día y últimas huellas; recoge todo lo que hay en Boxy)
  · Juegos    = biblioteca (estado, género de Steam, ficha, reseñas)        · Personas · Mi mes · Ajustes · Buscador (⌘/Ctrl + K)
  · Mi mes    = calendario de huellas + metas y rutinas del mes (esas dos se guardan en este navegador)
  Diseño: colores, tipografía, radios y componentes salen de tokens.json del documento Casa Blobs (variables en :root).
-->
<style>
/* ══════════ Tokens Casa Blobs ══════════ */
:root{
  --font-sans:"Zen Maru Gothic","M PLUS Rounded 1c",Nunito,system-ui,sans-serif;
  --sky-bg:#e4dccf;
  --ground:#f7f3ef; --surface:#fdfbf8; --surface-alt:#f0ebe4; --line:#e6dfd5; --line-strong:#8a857d;
  --ink:#111111; --ink-muted:#5c5953; --on-pastel:#111111;
  --yellow:#ffe59a; --pink:#ffb5c1; --mint:#b7e1d1; --sky:#a9d3ff;
  --yellow-ink:#7a5b00; --pink-ink:#b03a55; --mint-ink:#2a7357; --sky-ink:#2f62a3;
  --toggle-on:#4dbf8e; --toggle-knob:#fff; --focus:#2f62a3;
  --shadow-soft:0 8px 24px rgba(17,17,17,.06);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --radius-xs:6px; --radius-sm:12px; --radius-md:16px; --radius-lg:24px; --radius-xl:32px; --radius-pill:999px;
  --lateral:248px;
}
:root[data-theme="oscuro"]{
  --sky-bg:#0d0c0b;
  --ground:#181715; --surface:#232220; --surface-alt:#2e2c29; --line:#3a3834; --line-strong:#8f8a82;
  --ink:#f7f3ef; --ink-muted:#b5b0a7;
  --yellow-ink:#ffe59a; --pink-ink:#ffb5c1; --mint-ink:#b7e1d1; --sky-ink:#a9d3ff; --focus:#a9d3ff;
  --shadow-soft:0 8px 24px rgba(0,0,0,.4);
}
*{ box-sizing:border-box; margin:0; }
html{ -webkit-text-size-adjust:100%; }
body{ background:var(--ground); color:var(--ink); font:400 16px/1.5 var(--font-sans); -webkit-font-smoothing:antialiased; min-height:100vh; }
body.con-modal{ overflow:hidden; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; touch-action:manipulation; }
input,textarea,select{ font:inherit; color:inherit; }
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,a:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }
h1,h2,h3,h4{ font-weight:700; }
svg.i{ width:18px; height:18px; flex:none; stroke-width:1.75; }
.muted{ color:var(--ink-muted); } .small{ font-size:.85rem; } [hidden]{ display:none !important; }
.eyebrow,.lbl{ font-size:12px; line-height:16px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
.cap{ font-size:12px; line-height:18px; font-weight:500; color:var(--ink-muted); }

/* ══════════ Estructura: ventana de escritorio / pantalla completa en móvil ══════════ */
.app{ min-height:100vh; }
.lights,.top{ display:none; }
.lateral{ display:none; }
.principal{ min-width:0; }
.contenido{ max-width:1040px; margin:0 auto; padding:0 var(--space-5) calc(104px + env(safe-area-inset-bottom)); }
.topm{ position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 0 10px; background:color-mix(in srgb, var(--ground) 90%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.marca{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.1rem; }
.blob{ --sz:120px; --bg:var(--yellow); --eye:#111; position:absolute; width:var(--sz); height:calc(var(--sz)*.88); background:var(--bg); border-radius:58% 42% 55% 45%/52% 58% 42% 48%; flex:none; pointer-events:none; }
.blob::before,.blob::after{ content:""; position:absolute; top:52%; width:calc(var(--sz)*.07); height:calc(var(--sz)*.11); border-radius:50%; background:var(--eye); }
.blob::before{ left:38%; } .blob::after{ left:55%; }
.blob.b{ border-radius:45% 55% 38% 62%/58% 42% 58% 42%; } .blob.c{ border-radius:62% 38% 50% 50%/45% 55% 45% 55%; } .blob.d{ border-radius:40% 60% 62% 38%/55% 48% 52% 45%; }
.blob.pk{ --bg:var(--pink); } .blob.mt{ --bg:var(--mint); } .blob.sk{ --bg:var(--sky); } .blob.cr{ --bg:var(--surface-alt); --eye:var(--ink); }
.blob.l::before{ left:28%; } .blob.l::after{ left:45%; } .blob.r::before{ left:48%; } .blob.r::after{ left:65%; }
.blob.mini{ position:relative; }
.tabbar{ position:fixed; z-index:30; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); width:min(460px, calc(100% - 24px)); display:grid; grid-template-columns:repeat(5,1fr); padding:6px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-pill); box-shadow:var(--shadow-soft); }
.tab{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 0 6px; border-radius:var(--radius-pill); font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--ink-muted); }
.tab svg.i{ width:21px; height:21px; } .tab.activo{ background:var(--yellow); color:var(--on-pastel); }
.vista{ padding-top:6px; animation:entra .25s ease-out both; }
@keyframes entra{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
.cab-vista{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:20px 0 14px; flex-wrap:wrap; }
.cab-vista h1{ font-size:clamp(1.9rem,6vw,2.5rem); line-height:1.15; } .cab-vista p{ color:var(--ink-muted); font-size:.88rem; margin-top:2px; }
.herr{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

@media (min-width:1000px){
  body{ background:var(--sky-bg); height:100vh; overflow:hidden; }
  .app{ position:fixed; inset:28px; min-height:0; display:flex; border-radius:16px; overflow:hidden; background:var(--ground); box-shadow:0 30px 80px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.18); }
  .lights{ display:flex; align-items:center; gap:8px; height:48px; padding:0 10px; }
  .lights i{ width:12px; height:12px; border-radius:50%; display:block; }
  .lateral{ display:flex; flex-direction:column; gap:2px; width:var(--lateral); flex:none; padding:0 10px 14px; background:var(--surface-alt); border-right:1px solid var(--line); overflow-y:auto; }
  .marca{ padding:6px 8px; margin-bottom:6px; }
  .nav-item{ display:flex; align-items:center; gap:12px; height:38px; padding:0 10px; border-radius:var(--radius-sm); font-size:14px; font-weight:500; width:100%; text-align:left; }
  .nav-item svg.i{ color:var(--ink-muted); }
  .nav-item:hover{ background:rgba(127,120,105,.14); }
  .nav-item.activo{ background:var(--surface); font-weight:700; box-shadow:0 0 0 1px var(--line); } .nav-item.activo svg.i{ color:var(--ink); }
  .nav-item .kbd{ margin-left:auto; font-size:12px; color:var(--ink-muted); }
  .lateral .sec-nav{ padding:18px 10px 6px; }
  .principal{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .top{ display:flex; align-items:center; gap:12px; height:48px; flex:none; padding:0 20px 0 24px; border-bottom:1px solid var(--line); }
  .crumb{ font-size:14px; font-weight:700; margin-right:8px; white-space:nowrap; }
  .srch{ width:340px; max-width:40%; height:34px; border-radius:var(--radius-pill); background:var(--surface); border:1.5px solid var(--line-strong); display:flex; align-items:center; gap:10px; padding:0 14px; color:var(--ink-muted); font-size:14px; text-align:left; }
  .srch .kbd{ margin-left:auto; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:0 6px; background:var(--surface-alt); }
  .top .sp{ flex:1; }
  .contenido{ flex:1; min-height:0; max-width:none; margin:0; overflow-y:auto; padding:28px 56px 110px; overscroll-behavior:contain; }
  .contenido > .vista{ max-width:1560px; margin:0 auto; }
  .tabbar,.topm{ display:none; }
}

/* ══════════ Botones ══════════ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 22px; border-radius:var(--radius-pill); background:transparent; color:var(--ink); border:2px solid var(--ink); font-weight:700; font-size:14px; white-space:nowrap; transition:transform .2s ease-out; }
.btn:hover{ transform:translateY(-2px); } .btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.45; pointer-events:none; }
.btn.primario{ background:var(--ink); color:var(--ground); }
.btn.primario svg.i{ background:var(--yellow); color:var(--on-pastel); border-radius:50%; width:24px; height:24px; padding:5px; margin-left:-12px; stroke-width:2.6; }
.btn.peligro{ color:var(--pink-ink); border-color:var(--pink-ink); }
.btn.fantasma{ border-color:transparent; color:var(--ink-muted); } .btn.fantasma:hover{ background:var(--surface-alt); color:var(--ink); transform:none; }
.btn-i{ position:relative; width:44px; height:44px; display:inline-grid; place-items:center; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); flex:none; }
.btn-i:hover{ background:var(--surface-alt); } .btn-i.activo{ background:var(--ink); color:var(--ground); border-color:var(--ink); }
.btn-i .insignia{ position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; border-radius:9px; background:var(--yellow); color:var(--on-pastel); border:1.5px solid var(--ink); font-size:11px; display:grid; place-items:center; padding:0 4px; font-weight:700; }
.modal-cab .btn-i{ border-color:transparent; background:transparent; width:40px; height:40px; } .modal-cab .btn-i:hover{ background:var(--surface-alt); }

/* ══════════ Campos ══════════ */
.campo{ display:grid; gap:var(--space-2); } .campo > label,.etq{ font-size:13px; color:var(--ink); font-weight:700; }
.entrada{ width:100%; height:52px; padding:0 var(--space-4); background:var(--surface); color:var(--ink); border:1.5px solid var(--line-strong); border-radius:var(--radius-sm); outline:none; }
.entrada::placeholder{ color:var(--ink-muted); }
.entrada:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
textarea.entrada{ height:auto; min-height:52px; padding:14px 16px; resize:none; overflow:hidden; line-height:1.5; display:block; }
.form{ display:grid; gap:20px; } .fila2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 18px; border-radius:var(--radius-pill); background:transparent; border:1.5px solid var(--line-strong); font-size:14px; font-weight:700; color:var(--ink); transition:transform .2s ease-out; }
.chip:hover{ transform:translateY(-1px); } .chip.activo{ background:var(--ink); border-color:var(--ink); color:var(--ground); }
.chip svg.i{ width:16px; height:16px; }
.chip.solo{ width:44px; padding:0; justify-content:center; } .chip.solo svg.i{ width:19px; height:19px; }
.chip.avatar-chip{ padding:0 16px 0 6px; }
.sel-caja{ display:flex; align-items:center; gap:10px; width:100%; height:52px; padding:0 var(--space-4); background:var(--surface); border:1.5px solid var(--line-strong); border-radius:var(--radius-sm); text-align:left; }
.sel-caja .val{ flex:1; } .sel-caja svg.i:first-child{ color:var(--ink); } .sel-caja svg.i:last-child{ color:var(--ink-muted); width:16px; height:16px; }
.interruptor{ position:relative; width:64px; height:36px; border-radius:var(--radius-pill); background:var(--surface-alt); border:2px solid var(--line-strong); transition:background .2s ease-out; flex:none; }
.interruptor::after{ content:""; position:absolute; top:2px; left:2px; width:28px; height:28px; border-radius:50%; background:var(--line-strong); transition:transform .2s ease-out; }
.interruptor[aria-checked="true"]{ background:var(--toggle-on); border-color:var(--toggle-on); } .interruptor[aria-checked="true"]::after{ transform:translateX(28px); background:var(--toggle-knob); }
.seg{ display:inline-flex; border:1.5px solid var(--line-strong); border-radius:var(--radius-pill); padding:3px; background:var(--surface); }
.seg button{ display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 16px; border-radius:var(--radius-pill); color:var(--ink-muted); font-size:14px; font-weight:700; }
.seg button.activo{ background:var(--ink); color:var(--ground); }

/* ══════════ Tarjetas ══════════ */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-xl); position:relative; overflow:hidden; min-width:0; }
.card-pad{ padding:var(--space-6); }
.card.pastel{ border-color:transparent; color:var(--on-pastel); } .card.pastel .lbl,.card.pastel .eyebrow{ color:var(--on-pastel); }
.card.amarillo{ background:var(--yellow); } .card.rosa{ background:var(--pink); } .card.menta{ background:var(--mint); } .card.cielo{ background:var(--sky); }
.card-cab{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:var(--space-4); }
.fila-aj{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 24px; } .fila-aj + .fila-aj{ border-top:1px solid var(--line); }
.fila-aj .t{ font-weight:700; } .fila-aj .d{ color:var(--ink-muted); font-size:.85rem; }
button.fila-aj:hover{ background:var(--surface-alt); }
.ajustes{ display:grid; gap:28px; max-width:720px; } .ajustes h2{ margin:0 4px 10px; }
.ajustes h2{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
.vacio{ color:var(--ink-muted); text-align:center; padding:40px 10px; }
.auto{ font-size:11px; font-weight:700; color:var(--ink-muted); border:1.5px solid var(--line); border-radius:999px; padding:0 8px; white-space:nowrap; }

/* ══════════ Biblioteca de juegos ══════════ */
.pildoras{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:4px 2px 14px; margin-bottom:6px; }
.pildoras::-webkit-scrollbar{ display:none; } .pildoras .chip{ flex:none; }
.busca-fila{ display:flex; align-items:center; gap:10px; height:48px; padding:0 16px; margin-bottom:14px; background:var(--surface); border:1.5px solid var(--line-strong); border-radius:var(--radius-pill); }
.busca-fila input{ flex:1; background:none; border:0; outline:none; height:100%; } .busca-fila svg.i{ color:var(--ink-muted); }
.grupo-cab{ display:flex; align-items:center; justify-content:space-between; padding:26px 4px 16px; }
.grupo-cab:first-child{ padding-top:8px; }
.grupo-cab h3{ font-size:1.35rem; line-height:1.3; } .grupo-cab h3 small{ color:var(--ink-muted); font-weight:500; font-size:.8rem; margin-left:10px; }
.grupo-cab button{ display:inline-flex; align-items:center; gap:10px; font-size:14px; font-weight:700; }
.grupo-cab button svg.i{ width:28px; height:28px; padding:7px; border-radius:50%; background:var(--yellow); color:var(--on-pastel); stroke-width:2.4; }
.rejilla{ display:grid; grid-template-columns:repeat(var(--cols,6), minmax(0,1fr)); gap:22px 16px; }
.juego{ display:block; text-align:left; width:100%; }
.portada{ position:relative; display:block; aspect-ratio:3/4; border-radius:20px; overflow:hidden; background:var(--surface-alt); border:1px solid var(--line); transition:transform .2s ease-out; isolation:isolate; }
@media (hover:hover){ .juego:hover .portada{ transform:translateY(-3px); } }
.portada img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.portada .inicial{ position:absolute; inset:0 0 18px; display:grid; place-items:center; font-size:clamp(1.8rem,5vw,3rem); font-weight:700; color:var(--on-pastel); opacity:.85; }
.portada .velo{ position:absolute; inset:auto 0 0 0; padding:30px 12px 11px; background:linear-gradient(transparent, rgba(17,17,17,.82)); color:#fff; font-size:.82rem; font-weight:700; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.insig{ position:absolute; z-index:2; left:10px; top:10px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:var(--on-pastel); border:2px solid var(--ink); }
.insig svg.i{ width:14px; height:14px; stroke-width:2.4; }
.est-pendiente{ background:var(--surface-alt); color:var(--ink); } .est-jugando{ background:var(--yellow); } .est-pausa{ background:var(--sky); } .est-terminado{ background:var(--mint); } .est-abandonado{ background:var(--pink); }
.lista-j{ display:grid; gap:4px; }
.fila-j{ display:flex; align-items:center; gap:14px; padding:10px; border-radius:var(--radius-md); text-align:left; width:100%; }
.fila-j:hover{ background:var(--surface-alt); }
.fila-j .mini{ width:48px; aspect-ratio:3/4; border-radius:10px; overflow:hidden; position:relative; background:var(--surface-alt); flex:none; } .fila-j .mini img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.fila-j .mini .inicial,.partida .mini .inicial{ position:absolute; inset:0; display:grid; place-items:center; color:var(--on-pastel); font-weight:700; }
.fila-j .tx{ flex:1; min-width:0; } .fila-j .tx b{ display:block; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .fila-j .tx span{ color:var(--ink-muted); font-size:.85rem; }
.est-tag{ display:inline-flex; align-items:center; gap:8px; color:var(--ink-muted); font-size:.85rem; } .est-tag i{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; color:var(--on-pastel); border:2px solid var(--ink); } .est-tag i svg.i{ width:11px; height:11px; stroke-width:2.6; }
.estrellas{ display:inline-flex; gap:1px; color:var(--yellow-ink); } .estrellas svg{ width:14px; height:14px; } .estrellas .vac{ color:var(--line-strong); opacity:.5; }
.estrellas-edit{ display:inline-flex; gap:2px; } .estrellas-edit button{ position:relative; width:30px; height:30px; color:var(--line-strong); } .estrellas-edit button svg{ width:28px; height:28px; }
.estrellas-edit button.on{ color:var(--yellow-ink); } .estrellas-edit button .mitad{ position:absolute; inset:0 50% 0 0; overflow:hidden; color:var(--yellow-ink); } .estrellas-edit button .mitad svg{ width:28px; height:28px; }

/* ══════════ Colecciones ══════════ */
.grid-col{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:var(--space-5); }
.col-card{ display:flex; flex-direction:column; gap:10px; text-align:left; min-height:160px; justify-content:flex-end; transition:transform .2s ease-out; }
.col-card:hover{ transform:translateY(-3px); }
.col-ic{ width:48px; height:48px; border-radius:50%; background:var(--surface); display:grid; place-items:center; border:2px solid var(--ink); flex:none; color:var(--on-pastel); } .col-card .col-ic{ margin-bottom:auto; }
.portada.contener img{ object-fit:cover; padding:0; }
/* Inicio en una sola pantalla (escritorio) */
.ini{ display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:var(--space-4); margin-top:16px; }
.ini .card{ border-radius:24px; } .ini .card-pad{ padding:20px 22px; }
.hero{ min-height:0; display:flex; flex-direction:column; justify-content:space-between; gap:16px; padding:24px 28px !important; }
.hero h1{ font-size:clamp(1.8rem,3.4vw,2.4rem); line-height:1.15; position:relative; z-index:1; }
.hero .rapido-in{ position:relative; z-index:2; max-width:440px; height:48px; }
.ini-hoy{ min-height:0; display:flex; flex-direction:column; gap:10px; overflow:hidden; position:relative; }
.ini-hoy .pregunta{ font-size:22px; line-height:30px; position:relative; z-index:1; max-width:230px; }
.ini-cab{ display:flex; align-items:center; justify-content:space-between; margin:14px 0 6px; }
.ini-dia,.ini-rec{ min-height:0; overflow:hidden; }
.ini-rec .ini-cab{ margin-top:0; }
.ini .sem-cab{ margin-bottom:8px; } .ini .sem-cab button{ width:28px; height:28px; }
.ini .sem-dias{ gap:6px; } .ini .dia{ padding:6px 0 5px; border-radius:14px; } .ini .dia b{ font-size:1rem; }
.ini .hoy-lista{ gap:2px; }
.ini .partida{ background:none; padding:7px 6px; border-radius:var(--radius-md); gap:12px; } .ini .partida:hover{ background:var(--surface-alt); transform:none; }
.ini .partida .mini{ width:34px; border-radius:8px; }
.ini .linea{ gap:2px; } .ini .linea-fila{ padding:7px 6px; }
.ini .tx span,.ini .tx b{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

// Reduce una imagen elegida por el usuario (lado mayor `max`) y devuelve un Blob JPEG
function reducirImagen(file, max = 900){

    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);

// Prioridad cuando no hay datos oficiales: etiquetas de la comunidad → tu género
const MAPA_GENERO_JUEGO = [['Cozy','Cozy'],['Roguelike','Roguelike'],['Roguelite','Roguelike'],['Metroidvania','Metroidvania'],['Visual Novel','Novela visual'],
  ['Farming Sim','Simulación'],['Life Sim','Simulación'],['Survival','Supervivencia'],['Horror','Terror'],['Rhythm','Ritmo'],['Fighting','Lucha'],['Racing','Carreras'],
  ['Sports','Deportes'],['Platformer','Plataformas'],['Puzzle','Puzles'],['Shooter','Shooter'],['FPS','Shooter'],['MOBA','MOBA'],['Party','Party'],['Sandbox','Sandbox'],
  ['Massively Multiplayer','MMO'],['RPG','RPG'],['Strategy','Estrategia'],['City Builder','Simulación'],['Management','Simulación'],['Simulation','Simulación'],
  ['Story Rich','Narrativo'],['Adventure','Aventura'],['Action','Acción'],['Casual','Cozy'],
  ['Multijugador masivo','MMO'],['Rol','RPG'],['Estrategia','Estrategia'],['Simulación','Simulación'],['Carreras','Carreras'],['Deportes','Deportes'],['Aventura','Aventura'],['Acción','Acción']];
// «Rol» en Steam no siempre es un RPG (Stardew Valley es Rol porque haces de granjero): Simulación y los géneros muy marcados le ganan,
// y con Acción/Aventura/Estrategia solo cuenta como RPG si la comunidad también lo etiqueta como RPG entre lo principal.
const GENEROS_OFICIALES = {
  simulacion:['simulation','simuladores','simulación','simulacion'], mmo:['massively multiplayer','multijugador masivo'],
  carreras:['racing','carreras'], deportes:['sports','deportes'], rol:['rpg','rol'],
  estrategia:['strategy','estrategia'], aventura:['adventure','aventura'], accion:['action','acción','accion'] };
function generoOficial(j){
  const g = new Set((j.generos || []).map(x => String(x).toLowerCase().trim())), tiene = k => GENEROS_OFICIALES[k].some(x => g.has(x));
  if (tiene('simulacion')) return 'Simulación';
  if (tiene('mmo')) return 'MMO';
  if (tiene('carreras')) return 'Carreras';
  if (tiene('deportes')) return 'Deportes';
  const otro = tiene('estrategia') ? 'Estrategia' : tiene('aventura') ? 'Aventura' : tiene('accion') ? 'Acción' : null;
  if (tiene('rol')){
    const tags = (j.etiquetas || []).slice(0, 5).map(x => String(x).toLowerCase());
    const rolEnTags = tags.some(t => t.includes('rpg') || t === 'rol');
    if (!otro || rolEnTags || !tags.length) return 'RPG';
    return otro;
  }
  return otro;
}
function generoPorEtiquetas(j){
  const tags = new Set([...(j.etiquetas || []).slice(0, 10), ...(j.generos || [])].map(x => String(x).toLowerCase()));
  const hit = MAPA_GENERO_JUEGO.find(([k]) => { const kk = k.toLowerCase(); return [...tags].some(t => t === kk || (kk.length > 5 && t.includes(kk))); });
  return hit ? hit[1] : null;
}
const generoDeSteam = j => generoOficial(j) || generoPorEtiquetas(j);

async function llamarFuncion(nombre, body){
  if (!sb) return { ok:false, error:'sin_backend' };
  try{
    const { data, error } = await sb.functions.invoke(nombre, { body });
    if (error){ let status = error.context?.status || 0, det = ''; try{ det = String(await error.context?.text?.() || '').slice(0, 160); }catch(e){} return { ok:false, status, detalle:det, error:error.message || 'sin_conexion' }; }
    return data || { ok:false, error:'sin_respuesta' };
  }catch(e){ return { ok:false, error:String(e?.message || e) }; }
}
let completandoJuegos = false;
async function completarJuegosSteam({ todos = false, avisar = true } = {}){
  if (completandoJuegos) return;
  if (!sb){ if (avisar) aviso('Necesita Supabase y la función steam-info'); return; }
  const pend = S.objetos.filter(o => o.datos?.steam_appid && (todos || !o.datos?.steam_info));
  if (!pend.length){ if (avisar) aviso('Todos tus juegos ya están completos'); return; }
  completandoJuegos = true; let hechos = 0, fallo = false;
  if (avisar) aviso(`Completando ${pl(pend.length, 'juego', 'juegos')} desde Steam…`);
  for (let i = 0; i < pend.length && !fallo; i += 6){
    const lote = pend.slice(i, i + 6), r = await llamarFuncion('steam-info', { appids:lote.map(o => String(o.datos.steam_appid)) });
    if (!r.ok || !Array.isArray(r.juegos)){ fallo = r; console.warn('steam-info', r); break; }
    for (const o of lote){
      const j = r.juegos.find(x => String(x.appid) === String(o.datos.steam_appid)); if (!j || !j.ok) continue;
      const datos = { ...(o.datos || {}), steam_info:true }, g = generoDeSteam(j), actual = String(datos.genero || '').trim();
      // Solo pisa el género si estaba vacío o lo puso antes esta misma función (marca genero_auto)
      const eraAuto = datos.genero_auto || (!('genero_auto' in datos) && actual && actual === generoPorEtiquetas(j));
      if (g && (!actual || (eraAuto && actual !== g))){ datos.genero = g; datos.genero_auto = true; }
      if (j.descripcion && !String(datos.resumen || '').trim()) datos.resumen = String(j.descripcion).replace(/<[^>]+>/g, '').trim();
      if (j.desarrolladora && !datos.desarrolladora) datos.desarrolladora = j.desarrolladora;
      const anio = parseInt((String(j.fecha || '').match(/(19|20)\d{2}/) || [])[0]); if (anio && !datos.anio) datos.anio = anio;
      try{ const fila = await db.actualizar('objetos', o.id, { datos }); o.datos = fila.datos || datos; hechos++; }catch(e){ console.warn(e); }
    }
  }
  completandoJuegos = false;
  if (fallo){
    if (avisar) aviso(fallo.status === 404 ? 'Falta crear la función steam-info en Supabase' : fallo.status === 401 ? 'Supabase rechazó la llamada (revisa la clave)' : 'No se pudo contactar con steam-info');
  } else if (avisar) aviso(hechos ? `${pl(hechos, 'juego completado', 'juegos completados')} desde Steam` : 'Steam no devolvió datos nuevos');
  if (hechos) repintar();
}

const movilQ = matchMedia('(max-width:700px)');
const OPCIONES_COLS = () => movilQ.matches ? [3, 4, 5] : [5, 6, 7];
const claveCols = () => 'cols' + (movilQ.matches ? '.m' : '');
const colsJuegos = () => { const o = OPCIONES_COLS(), v = +leerLocal(claveCols()); return o.includes(v) ? v : (movilQ.matches ? o[0] : o[1]); };
const J = { q:'', buscando:false, orden:'fecha', dir:'desc', vista:leerLocal('vista') === 'lista' ? 'lista' : 'cuadricula',
  filtros:{ genero:new Set(), estado:new Set(), plataforma:new Set() } };
const nFiltros = () => Object.values(J.filtros).reduce((a, s) => a + s.size, 0);

function resultadosJuegos(){
  const q = norm(J.q.trim()), s = J.dir === 'asc' ? 1 : -1;
  const r = S.objetos.filter(o => (!q || norm([o.nombre, ...Object.values(o.datos || {}).flat().filter(v => typeof v === 'string' || typeof v === 'number')].join(' ')).includes(q))
    && Object.entries(J.filtros).every(([k, set]) => !set.size || valoresDe(o, k).some(v => set.has(v))));
  return r.sort(J.orden === 'titulo' ? (x, y) => s * x.nombre.localeCompare(y.nombre, 'es', { sensitivity:'base' })
    : (x, y) => s * ((instanteReciente(x) - instanteReciente(y)) || x.nombre.localeCompare(y.nombre, 'es')));
}
// Pastillas de género: solo icono (salvo «Todo»), y solo los géneros que existen en tu biblioteca
function pildorasHTML(){
  const cuenta = new Map(); S.objetos.forEach(o => lista(o.datos?.genero).forEach(g => cuenta.set(g, (cuenta.get(g) || 0) + 1)));
  const gs = [...cuenta.keys()].sort((a, b) => cuenta.get(b) - cuenta.get(a) || a.localeCompare(b, 'es'));
  if (gs.length < 2) return '';
  const sel = J.filtros.genero, todo = !sel.size;
  return `<button type="button" class="chip${todo ? ' activo' : ''}" data-gen="">${ic('sparkle')}Todo</button>`
    + gs.map(g => `<button type="button" class="chip solo${sel.size === 1 && sel.has(g) ? ' activo' : ''}" data-gen="${esc(g)}" title="${esc(g)} · ${cuenta.get(g)}" aria-label="${esc(g)}">${ic(iconoGenero(g))}</button>`).join('');
}
function pintarJuegos(){
  const cont = $('#juegosCont'); if (!cont) return;
  const nj = S.objetos.length, nh = S.huellas.length;
  $('#resumenJuegos').textContent = `${pl(nj, 'juego', 'juegos')} · ${pl(nh, ETQ.partida.toLowerCase(), ETQ.partidas.toLowerCase())}`;
  // pastillas (si desaparece el género elegido, se quita el filtro)
  const ph = pildorasHTML(), pw = $('#pildoras');
  if (J.filtros.genero.size && ![...J.filtros.genero].every(g => ph.includes(`data-gen="${esc(g)}"`))) J.filtros.genero = new Set();
  const ph2 = pildorasHTML(); if (pw._h !== ph2){ pw.innerHTML = ph2; pw._h = ph2; } pw.hidden = !ph2;
  const bf = $('[data-j="filtro"]'); const n = nFiltros(); bf.innerHTML = ic('filter') + (n ? `<span class="insignia">${n}</span>` : ''); bf.classList.toggle('activo', !!n);
  $('[data-j="vista"]').innerHTML = ic(J.vista === 'lista' ? 'list' : 'grid');
  const r = resultadosJuegos(), cols = colsJuegos();
  if (!nj){ cont.innerHTML = `<div class="vacio">Todavía no hay juegos.<br><br><button class="btn primario" data-j="nuevo2">${ic('plus')}Añadir el primero</button></div>`; return; }
  if (!r.length){ cont.innerHTML = '<p class="vacio">Nada coincide con la búsqueda o los filtros.</p>'; return; }
  if (J.vista === 'lista'){ cont.innerHTML = `<div class="lista-j">${r.map(filaJuego).join('')}</div>`; return; }
  const cuadricula = arr => `<div class="rejilla" style="--cols:${cols}">${arr.join('')}</div>`;
  const jug = r.filter(o => estadoJuego(o) === 'jugando');
  if (!nFiltros() && !J.q && jug.length){   // primera fila «Jugando ahora» y debajo el resto, con el estado como icono
    const resto = r.filter(o => estadoJuego(o) !== 'jugando');
    cont.innerHTML = `<div class="grupo-cab"><h3>Jugando ahora<small>${jug.length}</small></h3><button type="button" data-ver-jugando>Ver todos${ic('chev')}</button></div>
      <div class="rejilla" style="--cols:${cols}" data-fila-jugando>${jug.map(o => tarjetaJuego(o, { insignia:false })).join('')}</div>
      ${resto.length ? `<div class="grupo-cab"><h3>Mi biblioteca<small>${resto.length}</small></h3></div>${cuadricula(resto.map(o => tarjetaJuego(o)))}` : ''}`;
    const fila = $('[data-fila-jugando]', cont), nc = getComputedStyle(fila).gridTemplateColumns.split(' ').length;
    if (fila.children.length > nc) [...fila.children].slice(nc).forEach(e => e.remove()); else $('[data-ver-jugando]', cont)?.remove();
    return;
  }

}
function abrirVistaJuegos(){
  const m = crearModal({ titulo:'Vista', estrecho:true, cuerpo:'<div class="form" id="vm"></div>' });
  const pintar = () => { const cur = colsJuegos(), sinCols = J.vista === 'lista';
    $('#vm', m).innerHTML = `<div class="campo"><span class="etq">Estilo</span><div class="chips">

}
function abrirFiltrosJuegos(){
  const m = crearModal({ titulo:'Filtros', acciones:'<button class="btn fantasma" data-limpiar>Limpiar</button>' });
  const grupos = () => [['genero', 'Género', valoresExistentes('genero').map(v => ({ v, txt:v, ic:iconoGenero(v) }))],
    ['estado', 'Estado', OP.estado], ['plataforma', 'Plataforma', valoresExistentes('plataforma').map(v => ({ v, txt:v }))]].filter(g => g[2].length);
  const pintar = () => { $('.modal-cuerpo', m).innerHTML = `<div class="form">${grupos().map(([k, t, ops]) => `<div class="campo"><span class="etq">${t}</span><div class="chips">${ops.map(o => `<button type="button" class="chip${J.filtros[k].has(o.v) ? ' activo' : ''}" data-f="${k}" data-v="${esc(o.v)}">${o.ic ? ic(o.ic) : ''}${esc(o.txt)}</button>`).join('')}</div></div>`).join('')}</div>`; };
  m.addEventListener('click', e => {
    if (e.target.closest('[data-limpiar]')){ Object.values(J.filtros).forEach(s => s.clear()); }
    else { const b = e.target.closest('[data-f]'); if (!b) return; const s = J.filtros[b.dataset.f]; s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v); }
    pintar(); pintarJuegos();
  });
  pintar(); abrirModal(m);
}
function conectarJuegos(){
  const v = $('#v-juegos');
  $('[data-j="buscar"]').innerHTML = ic('search'); $('[data-j="orden"]').innerHTML = ic('sort'); $('[data-j="nuevo"]').innerHTML = ic('plus') + 'Nuevo';
  v.addEventListener('click', e => {
    const jg = e.target.closest('[data-juego]'); if (jg) return abrirFicha(jg.dataset.juego);
    const g = e.target.closest('[data-gen]'); if (g){ J.filtros.genero = g.dataset.gen ? new Set([g.dataset.gen]) : new Set(); return pintarJuegos(); }
    if (e.target.closest('[data-ver-jugando]')){ J.filtros.estado = new Set(['jugando']); return pintarJuegos(); }
    if (e.target.closest('[data-j="nuevo"], [data-j="nuevo2"]')) return abrirFormJuego();
    const b = e.target.closest('[data-j]'); if (!b) return;
    if (b.dataset.j === 'vista') abrirVistaJuegos();
    else if (b.dataset.j === 'filtro') abrirFiltrosJuegos();
    else if (b.dataset.j === 'buscar'){ J.buscando = !J.buscando; const f = $('#juegosBusca'); f.hidden = !J.buscando; b.classList.toggle('activo', J.buscando);
      if (J.buscando) $('input', f).focus(); else if (J.q){ J.q = ''; $('input', f).value = ''; pintarJuegos(); } }
    else if (b.dataset.j === 'orden'){
      const flecha = k => J.orden === k ? (J.dir === 'asc' ? ' ↑' : ' ↓') : '';
      abrirMenu(b, { opciones:[ { v:'fecha', txt:'Más reciente' + flecha('fecha'), ic:'clock' }, { v:'titulo', txt:'Título' + flecha('titulo'), ic:'list' } ], valor:J.orden,
        alElegir: k => { if (k === J.orden) J.dir = J.dir === 'asc' ? 'desc' : 'asc'; else { J.orden = k; J.dir = k === 'fecha' ? 'desc' : 'asc'; } b.classList.toggle('activo', !(J.orden === 'fecha' && J.dir === 'desc')); pintarJuegos(); } });
    }
  });
  $('#juegosBusca input').addEventListener('input', e => { J.q = e.target.value; pintarJuegos(); });
  movilQ.addEventListener('change', pintarJuegos);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { const c = $('#juegosCont'); if (c && c.clientWidth && Math.abs(c.clientWidth - (c._w || 0)) > 60 && !$('#v-juegos').hidden){ c._w = c.clientWidth; pintarJuegos(); } }).observe($('#juegosCont'));
}

function filaPartidaHTML(h){ return filaHistoria(h, 'data-huella'); }
function _filaPartidaVieja(h){
  const ps = personasDe(h), ctx = [MOMENTO_TXT[h.momento]];
  const min = +h.datos?.minutos || 0; if (h.datos?.sesiones) ctx.push(pl(h.datos.sesiones, 'sesión', 'sesiones')); if (min) ctx.push(tiempoJuego(min));

function fichaHTML(o, editandoResena){
  const d = o.datos || {}, hs = huellasDe(o), e = opEstado(estadoJuego(o)), ult = ultimaVezJuego(o), v = +d.valoracion || 0;

function abrirFicha(id){

    if (b.matches('[data-subir]')){ const r = await elegirArchivoImagen(); if (r){ st.sel = r; st.url = ''; f('url').value = ''; st.quitar = false; pintar(); } }

    else if (b.matches('[data-plat-v]')){ const p = b.dataset.platV; st.plataforma = st.plataforma.includes(p) ? st.plataforma.filter(x => x !== p) : [...st.plataforma, p]; pintar(); }
    else if (b.matches('[data-est-v]')){ st.estado = b.dataset.estV; pintar(); }
    else if (b.matches('[data-eliminar]')){
      if (!await confirmar({ titulo:`¿Eliminar «${o.nombre}»?`, texto:`También se borrarán sus ${ETQ.partidas.toLowerCase()}.` })) return;
      try{ await db.borrar('huellas', 'objeto_id', o.id); await db.borrar('objetos', 'id', o.id); }catch(err){ console.error(err); return aviso('No se pudo eliminar'); }
      const ids = new Set(S.huellas.filter(h => h.objeto_id === o.id).map(h => h.id));
      S.huellaPersonas = S.huellaPersonas.filter(hp => !ids.has(hp.huella_id)); S.huellas = S.huellas.filter(h => h.objeto_id !== o.id);
      S.objetos = S.objetos.filter(x => x.id !== o.id); S.porId.delete(o.id);
      const prof = pila.indexOf(m); cerrarHasta(Math.max(0, prof - 1)); setTimeout(repintar, 60); aviso('Juego eliminado');
    }
  });
  $('[data-guardar]', m).addEventListener('click', async ev => {
    const nombreN = f('nombre').value.trim(); if (!nombreN) return aviso('Escribe el título'), f('nombre').focus();
    const btn = ev.currentTarget; btn.disabled = true;
    try{
      const id = o?.id || uuid(), gen = f('genero').value.split(',').map(canonizarGenero).filter(Boolean);
      const datos = { ...d, genero:gen.length > 1 ? gen : gen[0], plataforma:st.plataforma, estado:st.estado, desarrolladora:f('desarrolladora').value.trim(), anio:parseInt(f('anio').value) || null,
        fecha_compra:f('fecha_compra').value, precio:f('precio').value.replace(',', '.').trim() ? Number(f('precio').value.replace(',', '.')) : null, steam_appid:f('steam_appid').value.trim(), resumen:f('resumen').value.trim() };
      if (JSON.stringify(lista(d.genero)) !== JSON.stringify(gen)) delete datos.genero_auto;   // si lo cambias tú, Steam ya no lo pisa
      Object.keys(datos).forEach(k => { if (datos[k] === null || datos[k] === '' || datos[k] === undefined || (Array.isArray(datos[k]) && !datos[k].length)) delete datos[k]; });
      let imagen_path = editando ? o.imagen_path : null;
      if (st.sel?.file) imagen_path = await guardarImagen('objetos', id, st.sel); else if (st.url.trim()) imagen_path = st.url.trim(); else if (st.quitar) imagen_path = null;
      if (editando){ const fila = await db.actualizar('objetos', id, { nombre:nombreN, datos, imagen_path }); Object.assign(o, fila); }
      else { const fila = await db.insertar('objetos', { id, tipo:'juego', nombre:nombreN, datos, imagen_path, origen:'manual' }); S.objetos.unshift(fila); S.porId.set(fila.id, fila); }
      const prof = pila.indexOf(m); cerrarHasta(prof); setTimeout(repintar, 60); aviso(editando ? 'Cambios guardados' : 'Juego añadido');
    }catch(err){ console.error(err); aviso('No se pudo guardar'); btn.disabled = false; }
  });
  pintar(); abrirModal(m); if (!editando) setTimeout(() => f('nombre').focus(), 250);
}

/* ============================================================
   ✦ MÓDULO · registro de partidas («Huellas»): rápido, formulario y elegir juego

const momentoAhora = () => { const h = new Date().getHours(); return h >= 6 && h < 14 ? 'manana' : h >= 14 && h < 21 ? 'tarde' : 'noche'; };
let diaSel = null;
async function crearObjetoRapido(nombre, tipo = 'juego'){
  const fila = await db.insertar('objetos', { tipo, nombre:nombre.trim(), datos:{}, imagen_path:null, origen:'manual' });
  S.todosObj.unshift(fila); S.porIdAll.set(fila.id, fila); if (tipo === 'juego'){ S.objetos.unshift(fila); S.porId.set(fila.id, fila); } return fila;
}
// Guarda una partida y sus personas. Lo usan el registro rápido y el formulario.
async function guardarPartida({ huella = null, objeto, accion = null, fecha, momento = null, personas = [], minutos = null, nota = '' }){
  const datos = { ...(huella?.datos || {}) }; if (minutos) datos.minutos = minutos; if (nota) datos.nota = nota;
  const fila = { accion:accion || huella?.accion || accionDe(objeto), fecha, momento:momento || null, objeto_id:objeto.id, datos };
  let h;
  if (huella){ h = await db.actualizar('huellas', huella.id, fila); Object.assign(huella, h); h = huella;
    await db.borrar('huella_personas', 'huella_id', h.id); S.huellaPersonas = S.huellaPersonas.filter(hp => hp.huella_id !== h.id); }
  else { h = await db.insertar('huellas', { ...fila, origen:'manual' }); if (S.porId.has(objeto.id)) S.huellas.push(h); else S.todasH.push(h); }
  for (const pid of personas){ const hp = { huella_id:h.id, persona_id:pid }; await db.insertar('huella_personas', hp); S.huellaPersonas.push(hp); }
  ordenarHuellas(); return h;
}
async function registrarRapido(objeto, personas = []){
  try{ await guardarPartida({ objeto, fecha:diaSel || aISO(new Date()), momento:momentoAhora(), personas }); }
  catch(e){ console.error(e); aviso('No se pudo guardar. Inténtalo de nuevo.'); return false; }
  repintar(); const nombres = personas.map(id => S.personas.find(p => p.id === id)?.nombre).filter(Boolean);
  aviso(`✦ ${objeto.nombre}${nombres.length ? ' con ' + listaHumana(nombres) : ''}`); return true;
}
function conectarRegistroRapido(){
  const inp = $('#rapidoIn'); let caja = null, items = [], activo = -1, pend = null;
  const cerrar = () => { caja?.remove(); caja = null; items = []; activo = -1; pend = null; };
  const cuando = () => !diaSel || diaSel === aISO(new Date()) ? 'hoy' : fechaCorta(diaSel);
  const recientes = () => { const v = new Set(), out = []; for (const h of S.todasH){ if (v.has(h.objeto_id)) continue; const o = S.porIdAll.get(h.objeto_id); if (!o) continue; v.add(h.objeto_id); out.push(o); if (out.length >= 5) break; } return out; };
  const personasOrden = () => [...S.personas].sort((a, b) => huellasCon(b.id).length - huellasCon(a.id).length || a.nombre.localeCompare(b.nombre, 'es'));
  const construir = () => {
    const q = norm(inp.value.trim());
    if (pend?.escoger){ items = TIPOS_ORD.map(k => ({ tipo:'tipoSel', k })); return `<div class="sug-cab">¿Qué es «${esc(pend.x.nombre)}»?</div>` + items.map((x, i) => `<button type="button" class="sug-fila ${i === activo ? 'act' : ''}" data-i="${i}"><span class="mini-p ${claseTipo(x.k)}">${ic(COL[x.k].ic)}</span><span><b>${esc(COL[x.k].sing)}</b></span></button>`).join(''); }
    if (pend){
      const nom = pend.x.tipo === 'nuevo' ? pend.x.nombre : pend.x.o.nombre, ps = personasOrden();
      items = [...ps.map(p => ({ tipo:'persona', p })), { tipo:'confirmar' }];
      const nombres = ps.filter(p => pend.ids.has(p.id)).map(p => p.nombre);
      return `<div class="sug-cab">¿Con quién? · ${esc(nom)}</div>` + items.map((x, i) => x.tipo === 'persona'
        ? `<button type="button" class="sug-fila ${pend.ids.has(x.p.id) ? 'sel' : ''} ${i === activo ? 'act' : ''}" data-i="${i}">${avatarHTML(x.p)}<span><b>${esc(x.p.nombre)}</b></span>${pend.ids.has(x.p.id) ? ic('check') : ''}</button>`
        : `<button type="button" class="sug-fila ${i === activo ? 'act' : ''}" data-i="${i}">${ic(nombres.length ? 'check' : 'user')}<span><b>${nombres.length ? `Guardar con ${esc(listaHumana(nombres))}` : 'Solo · guardar'}</b><small>${cuando()}</small></span></button>`).join('');
    }
    const base = q ? S.todosObj.filter(o => norm(o.nombre).includes(q)).sort((a, b) => (norm(a.nombre).startsWith(q) ? 0 : 1) - (norm(b.nombre).startsWith(q) ? 0 : 1)).slice(0, 6) : recientes();
    items = base.map(o => ({ tipo:'objeto', o }));
    if (q && !S.todosObj.some(o => norm(o.nombre) === q)) items.push({ tipo:'nuevo', nombre:inp.value.trim() });
    if (!items.length) return '';
    return (q ? '' : '<div class="sug-cab">Repetir</div>') + items.map((x, i) => x.tipo === 'nuevo'
      ? `<button type="button" class="sug-fila ${i === activo ? 'act' : ''}" data-i="${i}">${ic('plus')}<span><b>Crear «${esc(x.nombre)}»</b><small>Nuevo y guardar ${cuando()}</small></span></button>`
      : `<button type="button" class="sug-fila ${i === activo ? 'act' : ''}" data-i="${i}"><span class="mini-p ${claseTipo(tipoDe(x.o))}">${ic(ICONO_TIPO[tipoDe(x.o)] || 'sparkle')}</span><span><b>${esc(x.o.nombre)}</b><small>${esc(ETQ.partida)} · ${cuando()}</small></span></button>`).join('');
  };
  const pintar = () => {
    const html = construir(); if (!html){ cerrar(); return; }
    if (!caja){ caja = document.createElement('div'); caja.className = 'sug'; document.body.append(caja);
      caja.addEventListener('pointerdown', e => { e.preventDefault(); const b = e.target.closest('[data-i]'); if (b) elegir(items[+b.dataset.i]); }); }
    caja.innerHTML = html; const r = inp.closest('.rapido-in').getBoundingClientRect();
    Object.assign(caja.style, { left:r.left + 'px', top:(r.bottom + 6) + 'px', width:r.width + 'px' });
  };
  async function finalizar(x, ids){
    cerrar(); let objeto = x.o;
    if (x.tipo === 'nuevo'){ try{ objeto = await crearObjetoRapido(x.nombre, x.tipoObj || 'juego'); }catch(e){ console.error(e); return aviso('No se pudo crear. Inténtalo de nuevo.'); } }
    inp.value = ''; await registrarRapido(objeto, ids); inp.blur();
  }
  function elegir(x){
    if (!x) return;
    if (x.tipo === 'tipoSel'){ const nx = { ...pend.x, tipoObj:x.k }; pend = null; if (!S.personas.length) return finalizar(nx, []); pend = { x:nx, ids:new Set() }; pintar(); activo = items.length - 1; return pintar(); }
    if (x.tipo === 'persona'){ pend.ids.has(x.p.id) ? pend.ids.delete(x.p.id) : pend.ids.add(x.p.id); pintar(); return; }
    if (x.tipo === 'confirmar') return finalizar(pend.x, [...pend.ids]);
    if (x.tipo === 'nuevo' && !x.tipoObj){ pend = { x, escoger:true }; activo = -1; return pintar(); }
    if (!S.personas.length) return finalizar(x, []);
    pend = { x, ids:new Set() }; pintar(); activo = items.length - 1; pintar();   // ¿con quién?
  }
  inp.addEventListener('focus', pintar);
  inp.addEventListener('input', () => { pend = null; activo = -1; pintar(); });
  inp.addEventListener('blur', () => setTimeout(cerrar, 140));
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ cerrar(); inp.blur(); return; }
    if (!caja) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); activo = (activo + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; pintar(); }
    else if (e.key === 'Enter'){ e.preventDefault(); elegir(items[activo >= 0 ? activo : 0]); }
  });
  addEventListener('resize', cerrar); addEventListener('scroll', cerrar, { passive:true });
}

// Selector de juego (para el formulario de partida): devuelve { o } | { nuevo } | null
function elegirJuego(){
  return new Promise(ok => {
    let hecho = false;
    const m = crearModal({ titulo:'Elegir', estrecho:true, cuerpo:`<div class="busca-fila"><span data-x></span><input type="search" placeholder="Buscar o crear" autocomplete="off"></div><div class="lista-j" data-res></div>` });
    $('[data-x]', m).innerHTML = ic('search'); const inp = $('input', m), res = $('[data-res]', m); let rs = [];
    const pintar = () => { const q = norm(inp.value.trim()); rs = q ? S.todosObj.filter(o => norm(o.nombre).includes(q)) : S.todosObj.slice(0, 40);
      res.innerHTML = rs.map((o, i) => `<button class="fila-j" data-i="${i}"><span class="mini" style="${fondoPortada(o.nombre)}">${capaPortada(o, true)}</span><span class="tx"><b>${esc(o.nombre)}</b></span></button>`).join('')
        + (q && !S.todosObj.some(o => norm(o.nombre) === q) ? `<div style="padding:12px 8px"><span class="etq">Crear «${esc(inp.value.trim())}» como…</span><div class="chips" style="margin-top:8px">${TIPOS_ORD.map(k => `<button type="button" class="chip" data-nuevo-k="${k}">${ic(COL[k].ic)}${esc(COL[k].sing)}</button>`).join('')}</div></div>` : ''); };
    const fin = v => { if (hecho) return; hecho = true; ok(v); cerrarHasta(pila.indexOf(m)); };
    m.addEventListener('click', e => { const b = e.target.closest('[data-i]'), n = e.target.closest('[data-nuevo-k]'); if (b) fin({ o:rs[+b.dataset.i] }); else if (n) fin({ nuevo:inp.value.trim(), tipo:n.dataset.nuevoK }); });
    inp.addEventListener('input', pintar); m._alCerrar = () => { if (!hecho){ hecho = true; ok(null); } };
    pintar(); abrirModal(m); setTimeout(() => inp.focus(), 250);
  });
}
function abrirFormPartida({ huella = null, juego = null } = {}){
  const editando = !!huella;

      ${campoAccionHTML(st, editando)}

        <div class="campo"${CON_MOMENTO.has(st.accion) ? '' : ' hidden'}><label>Momento</label><button type="button" class="sel-caja" data-momento>${ic(OP.momento.find(x => x.v === st.momento)?.ic || 'clock')}<span class="val">${esc(OP.momento.find(x => x.v === st.momento)?.txt || 'Sin especificar')}</span>${ic('chevdown')}</button></div></div>
      <div class="campo"><label>Con quién</label><div class="chips">${S.personas.map(p => `<button type="button" class="chip avatar-chip${st.personas.has(p.id) ? ' activo' : ''}" data-persona="${p.id}">${avatarHTML(p)}${esc(p.nombre)}</button>`).join('')}
        <input class="entrada" data-nueva-persona placeholder="+ Nueva persona" style="width:150px;height:32px;border-radius:99px" autocomplete="off"></div></div>
      ${editando ? `<div><button type="button" class="btn peligro" data-eliminar>${ic('trash')}Eliminar ${esc(ETQ.partida.toLowerCase())}</button></div>` : ''}`;
  };
  form.addEventListener('click', e => { const fb = e.target.closest('[data-fecha-btn]'); if (fb) abrirCalendarioCasa(fb, { valor:st.fecha, alElegir: v => { st.fecha = v || hoyISO(); pintar(); } }); });
  const leer = () => { st.fecha = $('[data-fecha]', form)?.value || st.fecha; st.minutos = $('[data-minutos]', form)?.value || ''; st.nota = $('[data-nota]', form)?.value || ''; };
  form.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return; leer();
    if (b.matches('[data-juego-sel]')){ const r = await elegirJuego(); if (r?.o){ st.o = r.o; st.nuevo = null; } else if (r?.nuevo){ st.nuevo = r.nuevo; st.nuevoTipo = r.tipo || 'juego'; st.o = null; } pintar(); }
    else if (b.matches('[data-accion]')){ st.accion = b.dataset.accion; pintar(); }
    else if (b.matches('[data-momento]')) abrirMenu(b, { opciones:OP.momento, valor:st.momento, alElegir: v => { leer(); st.momento = v; pintar(); } });
    else if (b.matches('[data-persona]')){ const id = b.dataset.persona; st.personas.has(id) ? st.personas.delete(id) : st.personas.add(id); pintar(); }
    else if (b.matches('[data-eliminar]')){
      if (!await confirmar({ titulo:`¿Eliminar esta ${ETQ.partida.toLowerCase()}?` })) return;
      try{ await db.borrar('huellas', 'id', huella.id); }catch(err){ return aviso('No se pudo eliminar'); }
      S.huellas = S.huellas.filter(h => h.id !== huella.id); S.todasH = S.todasH.filter(h => h.id !== huella.id); S.huellaPersonas = S.huellaPersonas.filter(hp => hp.huella_id !== huella.id);
      cerrarHasta(Math.max(0, pila.indexOf(m))); setTimeout(repintar, 60); aviso('Eliminada');

    if (e.key !== 'Enter' || !e.target.matches('[data-nueva-persona]')) return; e.preventDefault();
    const nombre = e.target.value.trim(); if (!nombre) return; leer();
    try{ const p = await db.insertar('personas', { nombre }); S.personas.push(p); S.personas.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')); st.personas.add(p.id); pintar(); pintarPersonas(); }catch(err){ aviso('No se pudo crear'); }

      cerrarHasta(Math.max(0, pila.indexOf(m))); setTimeout(repintar, 60); aviso(editando ? 'Cambios guardados' : `✦ ${objeto.nombre}`);
    }catch(err){ console.error(err); aviso('No se pudo guardar'); btn.disabled = false; }
  });
  pintar(); abrirModal(m);
}

/* ---------- calendario propio (sin el del navegador) ---------- */
function abrirCalendarioCasa(ancla, { valor = null, alElegir }){
  if (_menu && _menu._ancla === ancla){ cerrarMenu(); return; }
  cerrarMenu();
  const el = document.createElement('div'); el.className = 'menu cal-pop'; el.dataset.cal = '1'; el._ancla = ancla; _menu = el;
  const base = valor ? aFecha(valor) : new Date(), d = { mes:base.getMonth(), anio:base.getFullYear(), modo:'dias' }, hoy = aISO(new Date());
  const pos = () => { const r = ancla.getBoundingClientRect(), mw = el.offsetWidth, mh = el.offsetHeight;
    let x = Math.min(Math.max(8, r.left), innerWidth - mw - 8), y = r.bottom + 6; if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 6); Object.assign(el.style, { left:x + 'px', top:y + 'px' }); };
  const pintar = () => {
    if (d.modo === 'dias'){
      const n = new Date(d.anio, d.mes + 1, 0).getDate(), huecos = (new Date(d.anio, d.mes, 1).getDay() + 6) % 7;
      let c = '<span></span>'.repeat(huecos); for (let i = 1; i <= n; i++){ const iso = aISO(new Date(d.anio, d.mes, i)); c += `<button type="button" class="${iso === hoy ? 'hoy ' : ''}${iso === valor ? 'sel' : ''}" data-dia="${iso}">${i}</button>`; }
      el.innerHTML = `<div class="cp-cab"><button type="button" data-cp="modo">${esc(MESES[d.mes].replace(/^./, x => x.toUpperCase()))} ${d.anio}${ic('chevdown')}</button><span style="display:flex"><button type="button" class="cp-fl" data-cp="prev" aria-label="Mes anterior">${ic('back')}</button><button type="button" class="cp-fl sig" data-cp="next" aria-label="Mes siguiente">${ic('back')}</button></span></div>
        <div class="cp-sem">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}</div><div class="cp-dias">${c}</div>
        <div class="cp-pie">${valor ? '<button type="button" data-cp="borrar">Borrar</button>' : '<span></span>'}<button type="button" data-cp="hoy">Hoy</button></div>`;
    } else {
      el.innerHTML = `<div class="cp-cab"><button type="button" data-cp="modo">${d.anio}${ic('chevdown')}</button><span style="display:flex"><button type="button" class="cp-fl" data-cp="aprev" aria-label="Año anterior">${ic('back')}</button><button type="button" class="cp-fl sig" data-cp="anext" aria-label="Año siguiente">${ic('back')}</button></span></div>
        <div class="cp-meses">${MESES.map((m, i) => `<button type="button" class="${i === d.mes ? 'sel' : ''}" data-mes="${i}">${esc(m.slice(0, 3))}</button>`).join('')}</div>`;
    }
    pos();
  };
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const a = b.dataset.cp;
    if (b.dataset.dia){ cerrarMenu(); return alElegir(b.dataset.dia); }
    if (b.dataset.mes){ d.mes = +b.dataset.mes; d.modo = 'dias'; }
    else if (a === 'prev'){ d.mes--; if (d.mes < 0){ d.mes = 11; d.anio--; } } else if (a === 'next'){ d.mes++; if (d.mes > 11){ d.mes = 0; d.anio++; } }
    else if (a === 'aprev') d.anio--; else if (a === 'anext') d.anio++; else if (a === 'modo') d.modo = d.modo === 'dias' ? 'meses' : 'dias';
    else if (a === 'hoy'){ cerrarMenu(); return alElegir(hoy); } else if (a === 'borrar'){ cerrarMenu(); return alElegir(null); }
    pintar(); });
  document.body.append(el); pintar();
}

    const fila = await extraDb.insertar('postits', { huella_id:id, texto, color, rel_objeto_id:o.id }); S.postits.push(fila); S.postitFecha.set(id, fecha);
  }
}
async function borrarNota(p){ await db.borrar('huellas', 'id', p.huella_id); try{ await extraDb.borrar('postits', 'huella_id', p.huella_id); }catch(e){} S.postits = S.postits.filter(x => x.huella_id !== p.huella_id); S.postitFecha.delete(p.huella_id); }
// Formulario de un post-it: cita de libro (tipo + página/minuto) o nota de cualquier objeto (fecha)
function abrirFormPens({ esNota = false, cita = null, nota = null, formato = '', alGuardar, alEliminar = null }){
  const previo = esNota ? nota : cita, fechaIni = esNota ? (S.postitFecha.get(nota?.huella_id) || hoyISO()) : null;
  const st = { tipo:cita?.tipo || 'cita', texto:previo?.texto || '', azar:!previo?.color, color:previo?.color || colorAzar(), fecha:fechaIni,
    ref: cita?.tiempo ? 'tiempo' : cita?.pagina ? 'pagina' : formato === 'audiolibro' ? 'tiempo' : 'pagina', pagina:cita?.pagina ?? '', hh:cita?.tiempo ? String(cita.tiempo).split(':')[0] : '', mm:cita?.tiempo ? String(cita.tiempo).split(':')[1] : '' };
  const m = crearModal({ titulo:previo ? 'Editar' : (esNota ? 'Nueva nota' : 'Nueva cita'), estrecho:true, acciones:'<button class="btn primario" data-guardar disabled>Guardar</button>',
    cuerpo:`<div class="pens-form">
      ${esNota ? '' : `<div class="chips" data-tipos>${TIPOS_PENS.map(t => `<button type="button" class="chip" data-tipo="${t.v}">${ic(t.ic)}${t.txt}</button>`).join('')}</div>`}
      <div class="postit-ed" style="--pc:${colorPostit(st.color)}"><textarea data-texto rows="3" placeholder="${esNota ? 'Escribe la nota…' : 'Escribe aquí lo que quieres guardar…'}">${esc(st.texto)}</textarea></div>
      ${esNota ? `<div class="campo"><label>Cuándo</label><button type="button" class="sel-caja" data-cuando>${ic('calendar')}<span class="val"></span>${ic('chevdown')}</button></div>`
        : `<div class="campo"><label>Referencia <span class="muted small">opcional</span></label><div class="chips"><button type="button" class="chip" data-ref="pagina">${ic('book')}Página</button><button type="button" class="chip" data-ref="tiempo">${ic('clock')}Tiempo</button></div>
          <div data-ref-pagina><input class="entrada" data-pagina inputmode="numeric" placeholder="Nº de página" value="${esc(st.pagina)}" autocomplete="off"></div>
          <div data-ref-tiempo class="fila2"><input class="entrada" data-hh inputmode="numeric" placeholder="Horas" value="${esc(st.hh)}" autocomplete="off"><input class="entrada" data-mm inputmode="numeric" placeholder="Minutos" value="${esc(st.mm)}" autocomplete="off"></div></div>`}
      <div class="campo"><label>Color</label><div class="colores"><button type="button" class="chip" data-azar>${ic('dice')}Aleatorio</button>${COLORES_POSTIT.map(c => `<button type="button" class="color-postit" data-color="${c.v}" style="--pc:${c.hex}" aria-label="${c.txt}"></button>`).join('')}</div></div>
      ${previo && alEliminar ? `<button type="button" class="btn fantasma peligro" data-eliminar>${ic('trash')}Eliminar</button>` : ''}</div>` });
  const ta = $('[data-texto]', m), bG = $('[data-guardar]', m), ed = $('.postit-ed', m);
  const pintar = () => {
    $$('[data-tipo]', m).forEach(b => b.classList.toggle('activo', b.dataset.tipo === st.tipo));
    $$('[data-ref]', m).forEach(b => b.classList.toggle('activo', b.dataset.ref === st.ref));
    if (!esNota){ $('[data-ref-pagina]', m).hidden = st.ref !== 'pagina'; $('[data-ref-tiempo]', m).hidden = st.ref !== 'tiempo'; }
    else $('[data-cuando] .val', m).textContent = st.fecha === hoyISO() ? 'Hoy' : fechaCorta(st.fecha);
    $('[data-azar]', m).classList.toggle('activo', st.azar);
    $$('[data-color]', m).forEach(b => b.classList.toggle('on', !st.azar && b.dataset.color === st.color));
    ed.style.setProperty('--pc', colorPostit(st.color)); bG.disabled = !st.texto.trim();
  };
  m.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tipo) st.tipo = b.dataset.tipo; else if (b.dataset.ref) st.ref = b.dataset.ref;
    else if (b.dataset.color){ st.color = b.dataset.color; st.azar = false; } else if (b.matches('[data-azar]')){ st.azar = true; st.color = colorAzar(); }
    else if (b.matches('[data-cuando]')){ abrirCalendarioCasa(b, { valor:st.fecha, alElegir: f => { st.fecha = f || hoyISO(); pintar(); } }); return; }
    else if (b.matches('[data-eliminar]')){ if (!await confirmar({ titulo:esNota ? '¿Eliminar esta nota?' : '¿Eliminar esta cita?', texto:'Esta acción no se puede deshacer.', si:'Eliminar' })) return; await alEliminar(); cerrarModal(); return; }
    else if (b.matches('[data-guardar]')){
      bG.disabled = true;
      try{
        const n = { texto:st.texto.trim(), color:st.color };
        if (esNota){ n.fecha = st.fecha; }
        else { n.tipo = st.tipo; n.fecha = cita?.fecha || hoyISO();
          if (st.ref === 'pagina'){ const p = parseInt($('[data-pagina]', m).value); if (p > 0) n.pagina = p; }
          else { const hh = Math.max(0, parseInt($('[data-hh]', m).value) || 0), mm = Math.min(59, Math.max(0, parseInt($('[data-mm]', m).value) || 0)); if (hh || mm) n.tiempo = `${hh}:${String(mm).padStart(2, '0')}`; } }
        await alGuardar(n); cerrarModal();
      }catch(err){ console.error(err); aviso('No se pudo guardar'); bG.disabled = false; }
      return; }
    else return;
    pintar();
  });
  ta.addEventListener('input', () => { st.texto = ta.value; autoCrecer(ta); pintar(); });
  pintar(); abrirModal(m); setTimeout(() => { autoCrecer(ta); if (!previo) ta.focus(); }, 320);
}

const esSerieCol = o => o?.tipo === 'audiovisual' && (['Serie', 'Anime'].includes(o.subtipo) || +o.datos?.temporadas > 0);

    if (d.fecha_inicio && d.fecha_fin){ const dias = Math.max(1, Math.round((aFecha(d.fecha_fin) - aFecha(d.fecha_inicio)) / 864e5) + 1); lect.push(['Tiempo', pl(dias, 'día', 'días')]); if (d.paginas) lect.push(['Ritmo', `≈ ${Math.round(d.paginas / dias)} páginas al día`]); }
    if (hs.length) lect.push(['Huellas', String(hs.length)]);
    const citas = Array.isArray(d.citas) ? d.citas : [], nC = citas.filter(c => c?.texto).length;
    const edic = [], compra = [];
    ['serie', 'editorial', 'anio', 'paginas', 'idioma', 'formato', 'genero'].forEach(c => { const f = camposPlanos('libro').find(x => x.k === c); if (f && d[c] !== undefined && d[c] !== '') edic.push([f.l, c === 'serie' ? esc(d.serie + (d.serie_num != null ? ` · nº ${d.serie_num}${d.serie_total ? ' de ' + d.serie_total : ''}` : '')) : textoValor(cfg, f, d[c])]); });
    ['fecha_compra', 'precio'].forEach(c => { const f = camposPlanos('libro').find(x => x.k === c); if (f && d[c]) compra.push([f.l, textoValor(cfg, f, d[c])]); });
    out = secF('Lectura', dl(lect)) + texto('resumen', 'Sinopsis', 'Sin sinopsis. Puedes añadirla aquí.') + texto('resena', 'Mi reseña', 'Todavía no has escrito tu reseña.')

  } else if (k === 'audiovisual'){

  } else {

    out = (generico.length ? secF('Detalles', dl(generico)) : '')
      + (rel.length ? secF(k === 'look' ? 'Prendas del look' : 'Looks con esta prenda', `<div class="rejilla" style="--cols:4">${rel.map(tarjetaCol).join('')}</div>`) : k === 'look' ? secF('Prendas del look', '<p class="muted small">Este look aún no tiene prendas. Edítalo para elegirlas.</p>') : '')
      + (cfg.val ? texto('resena', 'Mi reseña', 'Todavía no has escrito tu reseña.') : '') + secNotas;
  }
  return out;
}

    const es = e.target.closest('[data-estado]'); if (es) return abrirMenu(es, { opciones:ESTADO_LIBRO.map(x => ({ ...x, ic:EST_LIBRO_IC[x.v] })), valor:d.estado, alElegir: v => guardarDatosObjeto(o, { estado:v }).catch(() => aviso('No se pudo guardar')) });

/* ---------- Buscadores: libros (Google Books + Open Library) y películas/series (TMDB vía la función «tmdb» de Supabase) ---------- */
const IDIOMAS = { es:'Español', spa:'Español', spanish:'Español', en:'Inglés', eng:'Inglés', english:'Inglés', it:'Italiano', italian:'Italiano',
  fr:'Francés', french:'Francés', de:'Alemán', german:'Alemán', pt:'Portugués', portuguese:'Portugués', nl:'Neerlandés', dutch:'Neerlandés', ca:'Catalán', ja:'Japonés' };
const urlGoogle = v => { const u = v?.imageLinks?.thumbnail || v?.imageLinks?.smallThumbnail; return u ? u.replace(/^http:/, 'https:').replace('&edge=curl', '') + '&fife=w600' : null; };
// ✦ Buscador de libros por título: Google Books (sin clave, desde el navegador) y, si falla o no encuentra, Open Library.
const GENERO_LIBRO = [[/fantas/, 'Fantasía'], [/science fiction|sci-fi|ciencia ficci/, 'Ciencia ficción'], [/mystery|detective|crime|misterio|policia/, 'Misterio'],
  [/thriller|suspense/, 'Thriller'], [/romance|romántic/, 'Romance'], [/horror|terror/, 'Terror'], [/histor/, 'Histórica'], [/poetry|poes/, 'Poesía'],
  [/essay|philosoph|ensayo|filosof/, 'Ensayo'], [/biograph|autobiograph|memoir|biograf/, 'Biografía'], [/self-help|self help|autoayuda|personal growth/, 'Autoayuda'],
  [/comic|graphic novel|manga/, 'Cómic y manga'], [/young adult|juvenile fiction|juvenil/, 'Juvenil'], [/children|infantil/, 'Infantil'], [/dystop/, 'Distopía'],
  [/adventure|aventura/, 'Aventura'], [/humor|humour/, 'Humor'], [/classic|clásic/, 'Clásico'], [/literary|contemporary|contempor/, 'Contemporánea'], [/nonfiction|non-fiction|no ficci/, 'No ficción']];
const generoDeCategorias = cats => { const t = (cats || []).join(' ').toLowerCase(); const m = GENERO_LIBRO.find(([re]) => re.test(t)); return m ? m[1] : null; };
const limpiarHTMLTxt = h => String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
async function buscarLibrosGoogle(q, lang){
  const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books&orderBy=relevance${lang ? '&langRestrict=' + lang : ''}&fields=items(id,volumeInfo(title,authors,publishedDate,pageCount,categories,description,publisher,language,industryIdentifiers,imageLinks))`);
  if (!r.ok) throw new Error('google'); const j = await r.json();
  return (j.items || []).filter(it => it.volumeInfo?.title).map(it => { const v = it.volumeInfo, ids = v.industryIdentifiers || [];
    return { id:'g' + it.id, titulo:v.title, autor:(v.authors || []).join(', '), anio:parseInt(v.publishedDate) || null, paginas:v.pageCount || null, genero:generoDeCategorias(v.categories),
      resumen:limpiarHTMLTxt(v.description), editorial:v.publisher || '', idioma:v.language ? (IDIOMAS[String(v.language).toLowerCase()] || '') : '',
      isbn:(ids.find(x => x.type === 'ISBN_13') || ids.find(x => x.type === 'ISBN_10'))?.identifier || '', portada:urlGoogle(v) }; });
}
async function buscarLibrosOL(q){
  const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=10&fields=key,title,author_name,first_publish_year,number_of_pages_median,cover_i,isbn,publisher,language,subject`);
  if (!r.ok) throw new Error('ol'); const j = await r.json();
  return (j.docs || []).filter(d => d.title).map(d => ({ id:'o' + d.key, titulo:d.title, autor:(d.author_name || []).slice(0, 2).join(', '), anio:d.first_publish_year || null, paginas:d.number_of_pages_median || null,
    genero:generoDeCategorias(d.subject), resumen:'', editorial:(d.publisher || [])[0] || '', idioma:(d.language || [])[0] ? (IDIOMAS[String(d.language[0]).toLowerCase()] || '') : '',
    isbn:(d.isbn || [])[0] || '', clave:d.key, portada:d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg` : null }));
}
const normTxt = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
async function buscarLibrosApi(q){
  // Variantes: texto libre, "título - autor" / "título de autor" con operadores intitle/inauthor, y versión solo en español. Todas en paralelo.
  const consultas = [[q, ''], [q, 'es']];
  const m = q.match(/^(.+?)\s+(?:-|–|—|,|de|por|by)\s+(.+)$/i);
  if (m){ consultas.push([`intitle:"${m[1]}" inauthor:"${m[2]}"`, '']); }
  else consultas.push([`intitle:"${q}"`, '']);
  const lotes = await Promise.allSettled([...consultas.map(([c, l]) => buscarLibrosGoogle(c, l)), buscarLibrosOL(q)]);
  const res = lotes.flatMap(x => x.status === 'fulfilled' ? x.value : []);
  if (!res.length && lotes.every(x => x.status === 'rejected')) throw new Error('sin red');
  // Puntuación: cuántas palabras de lo escrito aparecen en título+autor; se prefieren las que tienen portada, páginas y año reciente
  const pal = normTxt(q).split(' ').filter(w => w.length > 1);
  const punt = x => { const t = normTxt(x.titulo + ' ' + x.autor); const h = pal.filter(w => t.includes(w)).length / (pal.length || 1);
    return h * 10 + (normTxt(x.titulo) === normTxt(q) ? 3 : 0) + (x.portada ? 1 : 0) + (x.paginas ? .5 : 0) + (x.anio ? Math.min(Math.max(x.anio - 1990, 0), 40) / 80 : 0); };
  const vistos = new Map();   // mismo título+autor → se queda el más completo
  res.forEach(x => { const k = normTxt(x.titulo) + '|' + normTxt(x.autor.split(',')[0]); const p = vistos.get(k);
    const [mejor, otro] = !p || punt(x) > punt(p) ? [x, p] : [p, x];
    if (otro) for (const c of ['resumen', 'portada', 'paginas', 'anio', 'editorial', 'idioma', 'genero', 'isbn', 'clave']) if (!mejor[c] && otro[c]) mejor[c] = otro[c];
    vistos.set(k, mejor); });
  return [...vistos.values()].sort((a, b) => punt(b) - punt(a)).slice(0, 8);
}

const ACC_TIPOS = ['Gorro', 'Gafas', 'Pelo', 'Joyería', 'Pañuelo', 'Bolso', 'Cinturón'];
const GEO_ACC = { Gorro:'left:28%;top:0;width:44%;height:16%;z-index:7', Pelo:'left:30%;top:4%;width:40%;height:11%;z-index:7', Gafas:'left:35%;top:12%;width:30%;height:7%;z-index:7', Joyería:'left:38%;top:21%;width:24%;height:9%;z-index:7', Pañuelo:'left:33%;top:21%;width:34%;height:10%;z-index:7', Cinturón:'left:27%;top:50%;width:46%;height:6%;z-index:7', Bolso:'left:70%;top:43%;width:30%;height:23%;z-index:7' };

function geoPrenda(p, k){

// Recorta los márgenes transparentes de la foto de una prenda para que llene bien su hueco en la muñeca
const TRIM_LOOK = new Map();
function recortar(url, alListo){
  if (TRIM_LOOK.has(url)) return; TRIM_LOOK.set(url, null);

  im.onload = () => { try{
    const w = Math.min(im.naturalWidth, 600), r = w / im.naturalWidth, h = Math.round(im.naturalHeight * r), c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently:true }); x.drawImage(im, 0, 0, w, h); const dt = x.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = 0, y1 = 0; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (dt[(j * w + i) * 4 + 3] > 24){ if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
    if (x1 <= x0 || y1 <= y0 || (x1 - x0 > w * .97 && y1 - y0 > h * .97)) return;

}

    }

  const procesar = async sel => {
    st.url = sel.vista || sel.url; st.fase = 'cargando'; pintar();
    try{ st.path = await guardarImagen('inspiracion', uuid(), sel); if (!st.path) throw new Error('sin ruta'); st.url = urlImagen(st.path) || st.url; }
    catch(err){ console.error(err); aviso('No se ha podido subir la foto'); st.fase = 'elegir'; return pintar(); }
    let g = null;

  const terminar = () => { const prendas = st.g.map(g => st.el.get(g.id)).filter(v => v && v !== 'ninguna');
    const piezas = st.g.filter(g => st.el.get(g.id) === 'ninguna').map(g => ({ descripcion:g.descripcion_visual, tipo_prenda:g.tipo_prenda, subtipo:g.subtipo }));
    const prof = pila.indexOf(m); cerrarHasta(prof); setTimeout(() => alTerminar({ prendas, piezas, insp:st.path }), 600); };
  m.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.matches('[data-elegir]')){ const s = await elegirArchivoImagen(); if (s) procesar(s); }
    else if (b.matches('[data-manual]')){ const prof = pila.indexOf(m); cerrarHasta(prof); setTimeout(() => alTerminar({ prendas:[], piezas:[], insp:st.path }), 600); }
    else if (b.dataset.cand){ const [gid, pid] = b.dataset.cand.split(':'); st.el.set(gid, st.el.get(gid) === pid ? null : pid); pintar(); }
    else if (b.dataset.no){ const gid = b.dataset.no; st.el.set(gid, st.el.get(gid) === 'ninguna' ? null : 'ninguna'); pintar(); }
    else if (b.dataset.mas){ const gid = b.dataset.mas, g = st.g.find(x => x.id === gid), cat = ({ top:'Superior', bottom:'Inferior', dress:'Vestidos', outerwear:'Chaquetas', shoes:'Zapatos', accessory:'Complementos' })[g?.tipo_prenda] || null;
      const pid = await elegirPrendaLook(cat); if (pid){ st.el.set(gid, pid); if (!g.candidatos?.some(c => c.id === pid)) (g.candidatos ||= []).unshift({ id:pid }); pintar(); } }
    else if (b.matches('[data-usar]')) terminar();
    else if (b.matches('[data-otra]')){ st.fase = 'elegir'; st.g = []; st.el.clear(); $('.modal-acc', m).innerHTML = ''; pintar(); }
  });
  pintar(); abrirModal(m);
}

/* ============================================================
   ✦ Temporadas (de Boxy): primavera mar–may · verano jun–ago · otoño sep–nov · invierno dic–feb
   ============================================================ */
const TEMP = {
  primavera:{ nombre:'Primavera', orden:0, meses:[2, 4], bg:'var(--mint)', ic:'✿' },
  verano:   { nombre:'Verano',    orden:1, meses:[5, 7], bg:'var(--yellow)', ic:'☼' },
  otono:    { nombre:'Otoño',     orden:2, meses:[8, 10], bg:'var(--pink)', ic:'❦' },
  invierno: { nombre:'Invierno',  orden:3, meses:[11, 1], bg:'var(--sky)', ic:'❄' },
};
const ORDEN_TEMP = ['primavera', 'verano', 'otono', 'invierno'];
function tempDe(d){
  const m = d.getMonth() + 1, t = m >= 3 && m <= 5 ? 'primavera' : m >= 6 && m <= 8 ? 'verano' : m >= 9 && m <= 11 ? 'otono' : 'invierno';
  return { t, anio: m <= 2 ? d.getFullYear() - 1 : d.getFullYear() };
}
const tempIdx = (t, anio) => anio * 4 + TEMP[t].orden;
const tempPeriodo = (t, anio) => { const [a, b] = TEMP[t].meses; return t === 'invierno' ? `${mayus(MESES[a])} ${anio} – ${mayus(MESES[b])} ${anio + 1}` : `${mayus(MESES[a])} – ${mayus(MESES[b])} ${anio}`; };

      if (!await confirmar({ titulo:'¿Restaurar esta copia?', texto:`${pl(objs.length, 'juego', 'juegos')} y ${pl(hs.length, ETQ.partida.toLowerCase(), ETQ.partidas.toLowerCase())}. Lo que ya existe con el mismo identificador se sustituye.`, si:'Restaurar' })) return;
      await db.mezclar('objetos', objs); await db.mezclar('personas', t.personas || []); await db.mezclar('huellas', hs);
      const hp = (t.huella_personas || []).filter(x => hids.has(x.huella_id)); if (sb){ if (hp.length) await sb.from('huella_personas').upsert(hp); } else { const d = _loc.leer(); hp.forEach(x => { if (!d.huella_personas.some(y => y.huella_id === x.huella_id && y.persona_id === x.persona_id)) d.huella_personas.push(x); }); _loc.guardar(); }
      await recargar(); aviso('Copia restaurada');
    }catch(e){ console.error(e); aviso('No se pudo leer esa copia'); }
  };
  i.click();
}
async function recargar(){ try{ await cargar(); repintar(); }catch(e){ console.error(e); aviso('No se pudo recargar'); } }

function pintarAjustes(){
  const cont = $('#ajustesCont'); if (!cont) return;
  const fila = (t, d, accion) => `<div class="fila-aj"><div><div class="t">${t}</div><div class="d">${d}</div></div>${accion}</div>`;
  cont.innerHTML = `<section><h2>Apariencia</h2><div class="card">${fila('Tema', temaPref === 'auto' ? 'Sigue el del sistema' : `Modo ${temaPref}`,
      `<div class="seg" role="group" aria-label="Tema">${[['auto', 'auto', 'Auto'], ['claro', 'sun', 'Claro'], ['oscuro', 'moon', 'Oscuro']].map(([v, i, t]) => `<button type="button" data-tema="${v}" class="${temaPref === v ? 'activo' : ''}">${ic(i)}${t}</button>`).join('')}</div>`)}</div></section>
    <section><h2>Steam</h2><div class="card">
      ${fila('Cuenta y sesiones', '<span data-estado-steam>Sin configurar</span>', '<button class="btn" data-a="steam">Configurar</button>')}
      ${fila('Completar datos', 'Género oficial, sinopsis, desarrolladora y año de tus juegos de Steam', '<button class="btn" data-a="completar">Completar</button>')}</div></section>
    <section><h2>Datos</h2><div class="card">
      ${fila('Dónde se guardan', modoLocal() ? 'En este navegador (modo local). Rellena CONFIG en el código para usar Supabase.' : 'En Supabase', `<span class="auto">${modoLocal() ? 'local' : 'supabase'}</span>`)}
      ${fila('Exportar', 'Copia completa en un archivo JSON', `<button class="btn" data-a="exportar">${ic('download')}Exportar</button>`)}
      ${fila('Restaurar', 'Desde un archivo exportado (también sirve el de Boxy)', '<button class="btn" data-a="restaurar">Restaurar</button>')}
      ${modoLocal() ? fila('Datos de ejemplo', 'Para ver la app con contenido', '<button class="btn" data-a="ejemplo">Cargar</button>') + fila('Borrar datos locales', 'Vacía lo guardado en este navegador', '<button class="btn peligro" data-a="borrar">Borrar</button>') : ''}</div></section>
    <p class="muted small" style="margin:-8px 4px 0">${esc(APP)} · v${esc(CONFIG.version)}</p>`;
  integracion('steam').then(s => { const e = $('[data-estado-steam]', cont); if (e) e.textContent = s?.config?.steamid ? (s.activa ? 'Activa' : 'Pausada') : 'Sin configurar'; }).catch(() => {});
}
function conectarAjustes(){
  $('#ajustesCont').addEventListener('click', async e => {
    const t = e.target.closest('[data-tema]'); if (t){ guardarTema(t.dataset.tema); return pintarAjustes(); }
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'steam') abrirSteam(); else if (a === 'completar') completarJuegosSteam({ todos:true }); else if (a === 'exportar') exportarCopia(); else if (a === 'restaurar') restaurarCopia();
    else if (a === 'ejemplo') cargarEjemplo();
    else if (a === 'borrar'){ if (await confirmar({ titulo:'¿Borrar todos los datos locales?', texto:'No se puede deshacer. Haz antes una exportación si quieres conservarlos.', si:'Borrar' })){ _loc.vaciar(); await recargar(); aviso('Datos borrados'); } }
  });
}

const VISTAS = ['inicio', 'mes', 'colecciones', 'col', 'juegos', 'personas', 'ajustes'];
const TITULOS = { inicio:'Inicio', mes:'Mi mes', juegos:'Juegos', personas:'Personas', ajustes:'Ajustes', colecciones:'Biblioteca' };
function irA(id, { scroll = true } = {}){
  let base = id.split(':')[0]; if (!VISTAS.includes(base) && base !== 'hub'){ id = 'inicio'; base = 'inicio'; }
  if (base === 'hub'){ const hh = id.split(':')[1]; hubAct = HUBS[hh] ? hh : null; base = 'colecciones'; if (!hubAct) id = 'colecciones'; } else if (base === 'colecciones') hubAct = null;
  if (base === 'col'){ const k = id.split(':')[1]; if (!COL[k] || k === 'juego'){ id = 'colecciones'; base = 'colecciones'; } else irAColeccion(k); }
  if (pila.length) cerrarHasta(0);
  VISTAS.forEach(v => { $('#v-' + v).hidden = v !== base; });
  const navId = base === 'col' ? (PADRE[id.split(':')[1]] ? 'hub:' + PADRE[id.split(':')[1]] : id) : base === 'colecciones' && hubAct ? 'hub:' + hubAct : id;
  $$('[data-ir]').forEach(b => b.classList.toggle('activo', b.dataset.ir === navId || (b.classList.contains('tab') && b.dataset.ir === 'colecciones' && (base === 'col' || base === 'juegos' || base === 'colecciones'))));
  try{ history.replaceState({ m:0 }, '', '#' + id); }catch(e){}
  $('#crumb').textContent = base === 'col' ? (PADRE[id.split(':')[1]] ? HUBS[PADRE[id.split(':')[1]]].nombre + ' › ' : '') + COL[id.split(':')[1]].nombre : base === 'colecciones' && hubAct ? HUBS[hubAct].nombre : TITULOS[base];
  if (base === 'juegos') pintarJuegos(); else if (base === 'ajustes') pintarAjustes(); else if (base === 'mes') pintarMes(); else if (base === 'inicio') pintarInicio(); else if (base === 'colecciones') pintarColecciones();
  if (scroll){ scrollTo(0, 0); $('.contenido')?.scrollTo(0, 0); }
}
addEventListener('hashchange', () => { if (!pila.length) irA(location.hash.slice(1), { scroll:false }); });
function enlazarGlobal(){

async function arrancar(){
  try{
    await cargar(); repintar();
    if (sb) setTimeout(() => completarJuegosSteam({ avisar:false }), 6000);   // rellena en silencio los juegos de Steam que aún no tienen datos
